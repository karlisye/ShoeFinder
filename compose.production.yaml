name: ${COMPOSE_PROJECT_NAME:-shoe_finder}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoe_finder}
      POSTGRES_USER: ${POSTGRES_USER:-shoe_finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoe_finder} -d ${POSTGRES_DB:-shoe_finder}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    environment:
      APP_NAME: ShoeFinder
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY}
      FILAMENT_ADMIN_EMAIL: ${FILAMENT_ADMIN_EMAIL}
      APP_LOCALE: lv
      APP_FALLBACK_LOCALE: lv
      OFFER_STALE_AFTER_HOURS: ${OFFER_STALE_AFTER_HOURS:-168}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-shoe_finder}
      DB_USERNAME: ${POSTGRES_USER:-shoe_finder}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
    volumes:
      - media_data:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend-web:
    build:
      context: .
      dockerfile: docker/backend-web/Dockerfile
    volumes:
      - media_data:/var/www/html/storage/app/public:ro
    depends_on:
      backend-php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      NUXT_BACKEND_HEALTH_URL: http://backend-web/up
      NUXT_BACKEND_API_URL: http://backend-web/api/v1
      NUXT_PUBLIC_SITE_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
