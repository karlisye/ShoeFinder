name: ${COMPOSE_PROJECT_NAME:-shoe_finder}

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoe_finder}
      POSTGRES_USER: ${POSTGRES_USER:-shoe_finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoe_finder} -d ${POSTGRES_DB:-shoe_finder}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  backend-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    environment:
      APP_NAME: ShoeFinder
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL}
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      FILAMENT_ADMIN_EMAIL: ${FILAMENT_ADMIN_EMAIL:?Set FILAMENT_ADMIN_EMAIL}
      APP_LOCALE: lv
      APP_FALLBACK_LOCALE: lv
      OFFER_STALE_AFTER_HOURS: ${OFFER_STALE_AFTER_HOURS:-168}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-shoe_finder}
      DB_USERNAME: ${POSTGRES_USER:-shoe_finder}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE: imports
      REDIS_QUEUE_RETRY_AFTER: 360
      REDIS_QUEUE_BLOCK_FOR: 5
      FEED_IMPORT_QUEUE: imports
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
    volumes:
      - feed_data:/var/www/html/storage/app/private/feed-imports
      - media_data:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    logging: *default-logging
    restart: unless-stopped

  backend-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    environment:
      APP_NAME: ShoeFinder
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL}
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      FILAMENT_ADMIN_EMAIL: ${FILAMENT_ADMIN_EMAIL:?Set FILAMENT_ADMIN_EMAIL}
      APP_LOCALE: lv
      APP_FALLBACK_LOCALE: lv
      OFFER_STALE_AFTER_HOURS: ${OFFER_STALE_AFTER_HOURS:-168}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-shoe_finder}
      DB_USERNAME: ${POSTGRES_USER:-shoe_finder}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE: imports
      REDIS_QUEUE_RETRY_AFTER: 360
      REDIS_QUEUE_BLOCK_FOR: 5
      FEED_IMPORT_QUEUE: imports
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
    volumes:
      - feed_data:/var/www/html/storage/app/private/feed-imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--queue=imports",
        "--sleep=1",
        "--tries=3",
        "--timeout=300",
        "--max-time=3600",
      ]
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "redis:imports", "--max=1000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    init: true
    logging: *default-logging
    restart: unless-stopped

  backend-web:
    build:
      context: .
      dockerfile: docker/backend-web/Dockerfile
    volumes:
      - media_data:/var/www/html/storage/app/public:ro
    depends_on:
      backend-php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      NUXT_BACKEND_HEALTH_URL: http://backend-web/up
      NUXT_BACKEND_API_URL: http://backend-web/api/v1
      NUXT_PUBLIC_SITE_URL: ${APP_URL:?Set APP_URL}
      NUXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    depends_on:
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    logging: *default-logging
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  feed_data:
  media_data:
