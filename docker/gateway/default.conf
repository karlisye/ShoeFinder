map $http_host $host_forwarded_port {
    ~:([0-9]+)$ $1;
    default $server_port;
}

map $http_x_forwarded_port $forwarded_port {
    ~^[0-9]+$ $http_x_forwarded_port;
    default $host_forwarded_port;
}

map $http_x_forwarded_proto $forwarded_proto {
    ~^(http|https)$ $http_x_forwarded_proto;
    default $scheme;
}

server {
    listen 80;
    server_name _;

    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /up {
        proxy_pass http://backend-web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ ^/(admin|livewire(?:-[A-Za-z0-9]+)?|storage|css/filament|js/filament|fonts/filament)(/|$) {
        proxy_pass http://backend-web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
